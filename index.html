<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volunteer Opportunity Finder</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#5f6d66;--line:#dfe4de;--brand:#1f7a5a;--brandink:#fff;--warn:#b4531a;--soft:#e6f2ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b231f;--ink:#e8eee9;--mut:#9aa8a0;--line:#2c3832;--brand:#3fb386;--brandink:#06150f;--warn:#e08a52;--soft:#1f3329;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b231f;--ink:#e8eee9;--mut:#9aa8a0;--line:#2c3832;--brand:#3fb386;--brandink:#06150f;--warn:#e08a52;--soft:#1f3329;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:960px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);margin:2px 0 12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--soft);border-radius:10px;padding:8px 14px}
.stat b{display:block;font-size:20px}
nav{display:flex;gap:6px;max-width:960px;margin:8px auto;padding:0 16px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font:inherit}
nav button.on{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
main{max-width:960px;margin:auto;padding:8px 16px 40px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:16px}
.tag{display:inline-block;background:var(--soft);color:var(--brand);border-radius:12px;padding:1px 9px;font-size:12px;margin-right:4px}
.meta{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{border:0;background:var(--brand);color:var(--brandink);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
form.panel,.panel{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:30px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,nav,main{position:relative;z-index:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
#xt{font:12px/1.4 ui-monospace,Consolas,monospace;margin-bottom:10px}
.warn{color:var(--warn)}
:root{--g1:#a8efcf;--g2:#a9d4ff;--g3:#ffe39a;--g4:#ffb8cf;--g5:#c3adff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#0d4a35;--g2:#10305a;--g3:#4a3a0c;--g4:#4a1a30;--g5:#2c1a5a}}
:root[data-theme="dark"]{--g1:#0d4a35;--g2:#10305a;--g3:#4a3a0c;--g4:#4a1a30;--g5:#2c1a5a}
body{min-height:100vh;background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g5),var(--g1));background-size:500% 500%;background-attachment:fixed;animation:shift var(--dur,14s) ease-in-out infinite}
@keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#bg{display:none}
:root[data-anim="off"] body{animation:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:16px;cursor:pointer;font:inherit}
.chip.on{background:var(--brand);color:var(--brandink);border-color:var(--brand)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#cb h4{margin:14px 0 6px;font-size:14px;color:var(--mut)}
.hero{text-align:center;padding:26px 16px}.hero h2{margin:0 0 6px;font-size:26px}.hero .row{justify-content:center}
h3.sec{margin:22px 0 10px}
.num{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brandink);display:grid;place-items:center;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>🤝 Volunteer Opportunity Finder</h1><div style="display:flex;gap:6px"><button type="button" id="th" class="btn alt" style="background:var(--card);white-space:nowrap" title="Switch theme"></button><button type="button" id="cu" class="btn alt" style="background:var(--card);white-space:nowrap">🎨 Customize</button></div></div>
  <p class="sub">Volunteer near you, in your free time, and track your social impact.</p>
  <div class="stats" id="stats"></div>
</header>
<nav id="nav">
  <button data-t="home" class="on">Home</button>
  <button data-t="find">Find opportunities</button>
  <button data-t="near">📍 Nearby</button>
  <button data-t="free">⏱️ Free time</button>
  <button data-t="report">🗑️ Report</button>
  <button data-t="team">👥 Teams</button>
  <button data-t="ai">✨ AI picks</button>
  <button data-t="me">🏆 Profile &amp; rewards</button>
  <button data-t="post">Post opportunity</button>
  <button data-t="vols">Volunteers</button>
  <button data-t="mine">Registrations &amp; hours</button>
  <button data-t="hist">🕘 History</button>
</nav>
<main id="main"></main>

<dialog id="cd"><p id="cm" style="margin-top:0"></p><div class="row"><button type="button" class="btn" id="cy">Yes, continue</button><button type="button" class="btn alt" id="cn">Cancel</button></div></dialog>
<dialog id="xd"><h3 style="margin-top:0">Export CSV</h3><textarea id="xt" rows="10" readonly></textarea><div class="row"><button type="button" class="btn" id="xc">Copy to clipboard</button><button type="button" class="btn alt" id="xx">Close</button></div></dialog>
<dialog id="cs"><h3 style="margin-top:0">Customize</h3><div id="cb"></div><div class="row" style="margin-top:14px"><button type="button" class="btn alt" id="cr">Reset</button><button type="button" class="btn" id="cc">Done</button></div></dialog>
<dialog id="pd"><h3 style="margin-top:0">Submit proof of participation</h3><label>What did you do? *</label><textarea id="pn" rows="3"></textarea><label style="margin-top:8px">Photo (optional)</label><input id="pi" type="file" accept="image/*"><div class="row"><button type="button" class="btn" id="pok">Submit proof</button><button type="button" class="btn alt" id="px">Cancel</button></div></dialog>
<dialog id="vd"><h3 id="vt" style="margin-top:0"></h3><div class="f2" style="grid-template-columns:1fr"><div><label>Full name *</label><input id="vn"></div><div><label>Email *</label><input id="ve" type="email"></div><div><label>Phone</label><input id="vp"></div><div><label>Area</label><select id="vc"></select></div><div><label>Skills</label><input id="vs" placeholder="Teaching, driving, first aid…"></div><div><label>Availability</label><select id="va"></select></div><div><label>Main interest</label><select id="vi"></select></div></div><p id="vm" class="warn"></p><div class="row"><button type="button" class="btn" id="vok">Save volunteer</button><button type="button" class="btn alt" id="vx">Cancel</button></div></dialog>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <form method="dialog" id="sf" style="margin:0">
    <h3 id="dt" style="margin-top:0"></h3>
    <div class="f2" style="grid-template-columns:1fr">
      <div><label>Full name *</label><input id="sn"></div>
      <div><label>Email *</label><input id="se" type="email"></div>
      <div><label>Phone</label><input id="sp"></div>
    </div>
    <p id="sm" class="warn"></p>
    <div class="row"><button type="button" class="btn" id="sok">Confirm registration</button><button type="button" class="btn alt" id="sx">Cancel</button></div>
  </form>
</dialog>

<script>
const CATS=["Education","Environment","Health","Food & Hunger","Animals","Community","Disaster Relief","Elderly Care","Events","Tech & Skills"];
const KEY="vof.v1";
let S={opps:[],vols:[]};
let tab="home",F={q:"",cat:"",mode:"",when:"upcoming",sort:"date"},cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);

function load(){
  try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){}
  S={opps:[
    {id:uid(),title:"Beach clean-up drive",org:"Green Shore Trust",cat:"Environment",desc:"Collect and sort plastic waste along the shoreline. Gloves and bags provided.",date:plus(5),start:"07:00",end:"10:00",loc:"Marina Beach, Chennai",mode:"In person",needed:25,skills:"None needed",contact:"hello@greenshore.org",signups:[]},
    {id:uid(),title:"Weekend maths tutoring",org:"Learn Together",cat:"Education",desc:"Help school students with maths homework and exam prep.",date:plus(9),start:"10:00",end:"12:00",loc:"Online (Google Meet)",mode:"Remote",needed:10,skills:"Good at maths",contact:"tutor@learntogether.org",signups:[]},
    {id:uid(),title:"Community food packing",org:"Meals for All",cat:"Food & Hunger",desc:"Pack and distribute meal kits to families in need.",date:plus(14),start:"09:00",end:"13:00",loc:"Community Hall, T. Nagar",mode:"In person",needed:15,skills:"None needed",contact:"packing@mealsforall.org",signups:[]},
    {id:uid(),title:"Evening sapling planting",org:"Adyar Greens",cat:"Environment",desc:"Plant and water native saplings along the river bank.",date:plus(0),start:"16:00",end:"18:00",loc:"Adyar, Chennai",mode:"In person",needed:20,skills:"None needed",contact:"plant@adyargreens.org",signups:[]},
    {id:uid(),title:"Elderly home visit & storytelling",org:"Silver Smiles",cat:"Elderly Care",desc:"Spend time, play games and read with senior residents.",date:plus(3),start:"17:00",end:"19:00",loc:"Anna Nagar, Chennai",mode:"In person",needed:8,skills:"Patience, kindness",contact:"visit@silversmiles.org",signups:[]},
    {id:uid(),title:"Digital literacy for seniors",org:"Tech4All",cat:"Tech & Skills",desc:"Teach phone, UPI and video-call basics.",date:plus(7),start:"15:00",end:"16:30",loc:"Velachery, Chennai",mode:"In person",needed:6,skills:"Phone and UPI basics",contact:"hi@tech4all.org",signups:[]},
    {id:uid(),title:"Health & blood donation camp",org:"CareFirst",cat:"Health",desc:"Help with registration, guidance and refreshments.",date:plus(11),start:"08:00",end:"13:00",loc:"Guindy, Chennai",mode:"In person",needed:12,skills:"First aid",contact:"camp@carefirst.org",signups:[]}
  ],vols:[
    {name:"Priya S",email:"priya@demo.in",city:"Adyar",skills:"Teaching, maths",avail:"Weekends",int:"Education"},
    {name:"Arun K",email:"arun@demo.in",city:"Guindy",skills:"First aid, driving",avail:"Anytime",int:"Health"},
    {name:"Meera R",email:"meera@demo.in",city:"Anna Nagar",skills:"Patience, storytelling",avail:"Evenings",int:"Elderly Care"},
    {name:"Karthik V",email:"karthik@demo.in",city:"Marina Beach",skills:"Gardening",avail:"Weekdays",int:"Environment"}
  ],reports:[
    {id:uid(),place:"Velachery lake edge",type:"Illegal dumping",sev:"High",desc:"Construction debris and plastic dumped near the lake.",photo:"",date:plus(-2),by:"Community member",up:3,status:"Open"},
    {id:uid(),place:"T. Nagar bus stop",type:"Overflowing bin",sev:"Medium",desc:"Bin not cleared for days.",photo:"",date:plus(-1),by:"Community member",up:1,status:"Open"}
  ]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const hrs=o=>{const[a,b]=[o.start,o.end].map(t=>{const[h,m]=(t||"0:0").split(":");return +h+ +m/60});return Math.max(0,b-a)};
const fmtD=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});

function stats(){
  const up=S.opps.filter(o=>o.date>=today()).length;
  const spots=S.opps.filter(o=>o.date>=today()).reduce((a,o)=>a+Math.max(0,o.needed-o.signups.length),0);
  $("#stats").innerHTML=[["Upcoming",up],["Open spots",spots],["Volunteers",S.vols.length]].map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join("");
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  stats();
  ({home:rHome,find:rFind,near:rNear,free:rFree,report:rReport,team:rTeam,ai:rAI,me:rMe,post:rPost,vols:rVols,mine:rMine,hist:rHist})[tab]();
}

function rFind(){
  $("#main").innerHTML=`<div class="filters">
  <input id="q" placeholder="Search title, org, location…" value="${esc(F.q)}">
  <select id="c"><option value="">All categories</option><option value="@env" ${F.cat==="@env"?"selected":""}>🌿 Environmental care</option><option value="@soc" ${F.cat==="@soc"?"selected":""}>🤲 Social service</option>${CATS.map(c=>`<option ${F.cat===c?"selected":""}>${c}</option>`).join("")}</select>
  <select id="m"><option value="">In person &amp; remote</option><option ${F.mode==="In person"?"selected":""}>In person</option><option ${F.mode==="Remote"?"selected":""}>Remote</option></select>
  <select id="w"><option value="upcoming" ${F.when==="upcoming"?"selected":""}>Upcoming</option><option value="all" ${F.when==="all"?"selected":""}>All dates</option><option value="week" ${F.when==="week"?"selected":""}>Next 7 days</option></select>
  </div><div class="row" style="margin:0 0 12px"><button class="btn alt" id="exp">Export CSV</button></div><div class="grid" id="list"></div>`;
  $("#q").oninput=e=>{F.q=e.target.value;list()};
  $("#c").onchange=e=>{F.cat=e.target.value;list()};
  $("#m").onchange=e=>{F.mode=e.target.value;list()};
  $("#w").onchange=e=>{F.when=e.target.value;list()};
  $("#exp").onclick=exportCsv;
  list();
}
function list(){
  const q=F.q.toLowerCase(),t=today(),wk=plus(7);
  const r=S.opps.filter(o=>(!q||[o.title,o.org,o.loc,o.desc,o.skills].join(" ").toLowerCase().includes(q))&&catOK(o)&&(!F.mode||o.mode===F.mode)&&(F.when==="all"||(F.when==="upcoming"&&o.date>=t)||(F.when==="week"&&o.date>=t&&o.date<=wk))).sort((a,b)=>a.date.localeCompare(b.date));
  $("#list").innerHTML=r.length?r.map(o=>card(o)).join(""):`<div class="empty" style="grid-column:1/-1">No matching opportunities. Try changing filters or post a new one.</div>`;
  $("#list").querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>openSU(b.dataset.su));
  $("#list").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ask("Delete this opportunity?",()=>{S.opps=S.opps.filter(o=>o.id!==b.dataset.del);save();render();toast("Opportunity deleted")})});
}
function card(o,x=""){
  const left=o.needed-o.signups.length,pct=Math.min(100,o.signups.length/o.needed*100),past=o.date<today();
  return `<div class="card"><div><span class="tag">${esc(o.cat)}</span><span class="tag">${esc(o.mode)}</span></div>
  <h3>${esc(o.title)}</h3><div class="meta">${esc(o.org)}</div>${x}
  <div>${esc(o.desc)}</div>
  <div class="meta">📅 ${fmtD(o.date)}<br>🕒 ${esc(o.start)}–${esc(o.end)} (${hrs(o).toFixed(1)} h)<br>📍 ${esc(o.loc)}<br>🧰 ${esc(o.skills||"None needed")}<br>✉️ ${esc(o.contact)}</div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="meta">${o.signups.length}/${o.needed} registered · ${left>0?left+" spots left":"Full"}</div>
  <div class="row"><button class="btn" data-su="${o.id}" ${left<=0||past?"disabled":""}>${past?"Past":left<=0?"Full":"Register"}</button><button class="btn alt" data-del="${o.id}">Delete</button></div></div>`;
}

function rPost(){
  $("#main").innerHTML=`<form class="panel" id="pf"><h3 style="margin-top:0">Post a volunteer opportunity</h3>
  <div class="f2"><div><label>Title *</label><input name="title" required></div><div><label>Organisation *</label><input name="org" required></div>
  <div><label>Type of work *</label><select name="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
  <div><label>Mode</label><select name="mode"><option>In person</option><option>Remote</option></select></div>
  <div><label>Date *</label><input type="date" name="date" min="${today()}" required></div>
  <div><label>Start time *</label><input type="time" name="start" required></div>
  <div><label>End time *</label><input type="time" name="end" required></div>
  <div><label>Volunteers needed *</label><input type="number" name="needed" min="1" value="10" required></div>
  <div><label>Location / link *</label><input name="loc" required></div>
  <div><label>Skills required</label><input name="skills" placeholder="e.g. First aid, teaching"></div>
  <div><label>Contact (email/phone) *</label><input name="contact" required></div></div>
  <label>Description &amp; what to bring</label><textarea name="desc" rows="3"></textarea>
  <div class="row"><button class="btn">Publish opportunity</button></div></form>`;
  $("#pf").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    if(d.end<=d.start){toast("End time must be after start time.");return}
    S.opps.push({id:uid(),...d,needed:+d.needed,signups:[]});save();tab="find";render();toast("Opportunity published")};
}

function rVols(){
  $("#main").innerHTML=`<div class="row" style="margin:0 0 12px"><button class="btn" id="av">➕ Add volunteer</button></div><div class="panel wrap"><h3 style="margin-top:0">All volunteers (${S.vols.length})</h3>${S.vols.length?`<table><tr><th>Name</th><th>Contact</th><th>Skills / interest</th><th>Availability</th><th>Hours</th><th></th></tr>${S.vols.map(v=>`<tr><td>${esc(v.name)}<div class="meta">${esc(v.city||"")}</div></td><td>${esc(v.email)}<div class="meta">${esc(v.phone||"")}</div></td><td>${esc(v.skills||"—")}<div class="meta">${esc(v.int||"")}</div></td><td>${esc(v.avail||"—")}</td><td>${volHours(v.email).toFixed(1)}</td><td><button class="btn alt" data-ed="${esc(v.email)}">Edit</button> <button class="btn alt" data-rm="${esc(v.email)}">Remove</button></td></tr>`).join("")}</table>`:`<div class="empty">No volunteers yet. Add the first one.</div>`}</div>`;
  $("#av").onclick=()=>openVol();
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>openVol(b.dataset.ed));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ask("Remove this volunteer and their registrations?",()=>{const m=b.dataset.rm;S.vols=S.vols.filter(v=>v.email!==m);S.opps.forEach(o=>{o.signups.filter(s=>s.email===m&&!s.proof).forEach(s=>logH("cancelled",o,s));o.signups=o.signups.filter(s=>s.email!==m)});save();render();toast("Volunteer removed")})});
}
let vEdit=null;
function openVol(email){
  const v=email?S.vols.find(x=>x.email===email):null;vEdit=v?v.email:null;
  const op=(a,x)=>a.map(i=>`<option ${x===i?"selected":""}>${i}</option>`).join("");
  $("#vt").textContent=v?"Edit volunteer":"Add a new volunteer";
  $("#vc").innerHTML=op(Object.keys(AREAS).concat("Other"),v&&v.city);$("#va").innerHTML=op(["Weekdays","Weekends","Evenings","Anytime"],v&&v.avail);$("#vi").innerHTML=op(CATS,v&&v.int);
  $("#vn").value=v?v.name:"";$("#ve").value=v?v.email:"";$("#ve").readOnly=!!v;$("#vp").value=v?v.phone||"":"";$("#vs").value=v?v.skills||"":"";$("#vm").textContent="";
  $("#vd").showModal();
}
$("#vx").onclick=()=>$("#vd").close();
$("#vok").onclick=()=>{
  const d={name:$("#vn").value.trim(),email:$("#ve").value.trim(),phone:$("#vp").value.trim(),city:$("#vc").value,skills:$("#vs").value.trim(),avail:$("#va").value,int:$("#vi").value};
  if(!d.name||!/^\S+@\S+\.\S+$/.test(d.email)){$("#vm").textContent="Please enter a name and a valid email.";return}
  if(!vEdit&&S.vols.some(v=>v.email.toLowerCase()===d.email.toLowerCase())){$("#vm").textContent="A volunteer with this email already exists.";return}
  upsert(d);save();$("#vd").close();render();toast(vEdit?"Volunteer updated":"Volunteer added ✓");
};

function score(v,o){const d=new Date(o.date+"T00:00").getDay(),we=d===0||d===6;let s=0,w=[];

  if(v.avail==="Anytime"||(v.avail==="Weekends"&&we)||(v.avail==="Weekdays"&&!we)||(v.avail==="Evenings"&&o.start>="17:00")){s+=2;w.push("free "+(v.avail||"").toLowerCase())}

/* Live animated background */
(function(){
const c=$("#bg"),x=c.getContext("2d");let W,H,P=[],B=[],R=[],S=[],mx=-999,my=-999,t=0;
const reduce=true;
const rgb=h=>{h=h.replace("#","");return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const brand=()=>{const v=css("--brand");return /^#[0-9a-f]{6}$/i.test(v)?rgb(v):[31,122,90]};
const isDark=()=>{const v=css("--bg");return /^#[0-9a-f]{6}$/i.test(v)?rgb(v).reduce((a,b)=>a+b)<300:false};
const COL=[[31,122,90],[59,130,196],[224,160,48],[214,80,110],[60,190,170]];
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
const n=Math.round(Math.min(70,W*H/18000));
P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.8,vy:-.3-Math.random()*.8,r:1.5+Math.random()*2.5,ph:Math.random()*6.28}));
B=[0,1,2,3,4].map(i=>({a:Math.random()*6.28,s:.012+Math.random()*.008,r:Math.max(W,H)*(.32+.06*i)}));
const m=Math.round(Math.min(22,W*H/45000));
S=Array.from({length:m},()=>mk(true))}
function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:H+40,s:10+Math.random()*16,v:.5+Math.random()*1.1,k:Math.random()<.5?0:1,c:COL[Math.floor(Math.random()*5)],rot:Math.random()*6.28,rs:(Math.random()-.5)*.04,ph:Math.random()*6.28}}
function heart(s){x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s*.9,-s*.2,-s*.5,-s*.8,0,-s*.35);x.bezierCurveTo(s*.5,-s*.8,s*.9,-s*.2,0,s*.35);x.fill()}
function leaf(s){x.beginPath();x.moveTo(0,-s);x.bezierCurveTo(s*.8,-s*.4,s*.8,s*.5,0,s);x.bezierCurveTo(-s*.8,s*.5,-s*.8,-s*.4,0,-s);x.fill();x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=1;x.beginPath();x.moveTo(0,-s*.8);x.lineTo(0,s*.8);x.stroke()}
function rays(bc,dk){
const cx=W*.5+Math.sin(t*.4)*W*.2,a0=t*.25;
for(let i=0;i<6;i++){const a=a0+i*1.0472,L=Math.max(W,H)*1.4,w=.14;
const g=x.createLinearGradient(cx,-40,cx+Math.cos(a)*L,-40+Math.sin(a)*L);
g.addColorStop(0,"rgba("+bc+","+(dk?.14:.16)+")");g.addColorStop(1,"rgba("+bc+",0)");
x.fillStyle=g;x.beginPath();x.moveTo(cx,-40);x.lineTo(cx+Math.cos(a-w)*L,-40+Math.sin(a-w)*L);x.lineTo(cx+Math.cos(a+w)*L,-40+Math.sin(a+w)*L);x.closePath();x.fill()}}
function waves(bc){
[[.74,.07,.008,1.6,.12],[.82,.06,.011,-2.2,.14],[.90,.05,.015,2.8,.16]].forEach(([y,a,f,s,al])=>{
x.beginPath();x.moveTo(0,H);
for(let i=0;i<=W+12;i+=10)x.lineTo(i,H*y+Math.sin(i*f+t*s)*H*a*.6+Math.sin(i*f*.5-t*s*.7)*H*a*.5);
x.lineTo(W,H);x.closePath();x.fillStyle="rgba("+bc+","+al+")";x.fill()})}
function frame(){
t+=.03;x.clearRect(0,0,W,H);
const bc=brand(),dk=isDark(),al=dk?.32:.38;
B.forEach((o,i)=>{o.a+=o.s;const cx=W*(.5+.5*Math.cos(o.a+i*1.7)),cy=H*(.5+.5*Math.sin(o.a*1.3+i*2.1)),cl=i?COL[i]:bc;
const g=x.createRadialGradient(cx,cy,0,cx,cy,o.r);g.addColorStop(0,"rgba("+cl+","+al+")");g.addColorStop(1,"rgba("+cl+",0)");x.fillStyle=g;x.fillRect(0,0,W,H)});
rays(bc,dk);waves(bc);
S.forEach((s,i)=>{s.y-=s.v;s.x+=Math.sin(t*1.2+s.ph)*.9;s.rot+=s.rs;
if(s.y<-40)S[i]=mk(false);
x.save();x.translate(s.x,s.y);x.rotate(Math.sin(t+s.ph)*.5+s.rot);x.fillStyle="rgba("+s.c+","+(dk?.5:.45)+")";
s.k?heart(s.s):leaf(s.s);x.restore()});
P.forEach(p=>{p.x+=p.vx+Math.sin(t*1.5+p.ph)*.4;p.y+=p.vy;
if(p.y<-10){p.y=H+10;p.x=Math.random()*W}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<140&&d>0){p.x+=dx/d*3;p.y+=dy/d*3}
const tw=.5+.5*Math.sin(t*3+p.ph),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
g.addColorStop(0,"rgba("+bc+","+(.5+.4*tw)+")");g.addColorStop(1,"rgba("+bc+",0)");x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*5,0,6.283);x.fill()});
x.lineWidth=1;
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<120){x.strokeStyle="rgba("+bc+","+((1-d/120)*.35)+")";x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
R=R.filter(r=>r.l>0);R.forEach(r=>{r.l-=.015;r.r+=3.2;x.strokeStyle="rgba("+bc+","+(r.l*.55)+")";x.lineWidth=2.5;x.beginPath();x.arc(r.x,r.y,r.r,0,6.283);x.stroke()});
if(!reduce)requestAnimationFrame(frame)}
addEventListener("resize",()=>{size();if(reduce)frame()});
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY});
addEventListener("pointerdown",e=>{R.push({x:e.clientX,y:e.clientY,r:6,l:1})});
addEventListener("pointerleave",()=>{mx=my=-999});
size();frame();
})();

/* ===== Registration history ===== */
function logH(type,o,s){S.hist=S.hist||[];S.hist.unshift({id:uid(),ts:new Date().toISOString(),type,name:s.name,email:s.email,title:o.title,org:o.org,date:o.date,start:o.start,end:o.end,h:+hrs(o).toFixed(2)});S.hist=S.hist.slice(0,500)}
const HT={registered:["📝","Registered"],cancelled:["❌","Cancelled"],proof:["✅","Completed (proof submitted)"]};
let HF={who:null,type:"",q:""};
const fmtTS=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
function histRows(){
  const me=S.me,q=HF.q.toLowerCase();
  const base=S.hist.filter(h=>HF.who==="all"||(me&&h.email.toLowerCase()===me.email.toLowerCase()));
  return{base,rows:base.filter(h=>(!HF.type||h.type===HF.type)&&(!q||[h.title,h.org,h.name,h.email].join(" ").toLowerCase().includes(q)))};
}
function rHist(){
  const me=S.me;if(HF.who===null)HF.who=me?"me":"all";
  const{base}=histRows();
  const n=t=>base.filter(h=>h.type===t).length,hh=base.filter(h=>h.type==="proof").reduce((a,h)=>a+h.h,0);
  $("#main").innerHTML=`<div class="stats" style="margin-bottom:12px">${[["Registrations",n("registered")+n("proof")+n("cancelled")],["Completed",n("proof")],["Cancelled",n("cancelled")],["Hours completed",hh.toFixed(1)]].map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join("")}</div>
  <div class="filters"><div><label>Show</label><select id="hw"><option value="me" ${HF.who==="me"?"selected":""}>My history</option><option value="all" ${HF.who==="all"?"selected":""}>Everyone</option></select></div>
  <div><label>Action</label><select id="ht"><option value="">All actions</option>${Object.keys(HT).map(k=>`<option value="${k}" ${HF.type===k?"selected":""}>${HT[k][1]}</option>`).join("")}</select></div>
  <div><label>Search</label><input id="hq" placeholder="Opportunity, organisation, person…" value="${esc(HF.q)}"></div></div>
  <div class="row" style="margin:0 0 12px"><button class="btn alt" id="hx">Export CSV</button><button class="btn alt" id="hc">Clear history</button></div>
  ${HF.who==="me"&&!me?'<p class="meta">Create a profile (Profile &amp; rewards) to keep a personal history, or switch to “Everyone”.</p>':""}
  <div class="panel wrap" id="hl"></div>`;
  const draw=()=>{const{rows}=histRows();
    $("#hl").innerHTML=rows.length?`<h3 style="margin-top:0">Activity timeline (${rows.length})</h3><table><tr><th>When</th><th>Volunteer</th><th>Opportunity</th><th>Event date</th><th>Action</th></tr>${rows.map(h=>`<tr><td>${fmtTS(h.ts)}</td><td>${esc(h.name)}<div class="meta">${esc(h.email)}</div></td><td>${esc(h.title)}<div class="meta">${esc(h.org)}</div></td><td>${fmtD(h.date)}<div class="meta">${esc(h.start)}–${esc(h.end)} (${h.h} h)</div></td><td>${HT[h.type][0]} ${HT[h.type][1]}</td></tr>`).join("")}</table>`:`<div class="empty">No history yet. Register for an opportunity and it will appear here.</div>`};
  $("#hw").onchange=e=>{HF.who=e.target.value;rHist()};
  $("#ht").onchange=e=>{HF.type=e.target.value;draw()};
  $("#hq").oninput=e=>{HF.q=e.target.value;draw()};
  $("#hx").onclick=()=>{const{rows}=histRows();
    const r=[["When","Volunteer","Email","Opportunity","Organisation","Event date","Start","End","Hours","Action"]].concat(rows.map(h=>[h.ts,h.name,h.email,h.title,h.org,h.date,h.start,h.end,h.h,HT[h.type][1]]));
    $("#xt").value=r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");$("#xd").showModal()};
  $("#hc").onclick=()=>ask("Clear all registration history? Your registrations and points are not affected.",()=>{S.hist=[];save();rHist();toast("History cleared")});
  draw();
}

const THS=[["auto","🌗 Auto"],["light","☀️ Light"],["dark","🌙 Dark"]];
let thm="auto";
try{thm=localStorage.getItem("vof.theme")||"auto"}catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(thm==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",thm);
  $("#th").textContent=(THS.find(t=>t[0]===thm)||THS[0])[1];

}
$("#th").onclick=()=>{

  try{localStorage.setItem("vof.theme",thm)}catch(e){}
  applyTheme();toast("Theme: "+thm);
};
const PAL={
 Meadow:{l:['#a8efcf','#a9d4ff','#ffe39a','#ffb8cf','#c3adff'],d:['#0d4a35','#10305a','#4a3a0c','#4a1a30','#2c1a5a']},
 Ocean:{l:['#a5e8f5','#9fc5ff','#b9f0e4','#a7b8ff','#8fe3ff'],d:['#06344a','#0b2a5c','#07433f','#1a2460','#06384f']},
 Sunset:{l:['#ffd1a3','#ffb3b3','#ffe08a','#f9a8d4','#fdba74'],d:['#5a2a0c','#5a1a1f','#4a3a0c','#4a1a40','#5a3010']},
 Aurora:{l:['#b6f5c8','#b4a7ff','#9be7ff','#f0b4ff','#c8ffb0'],d:['#0a4a2c','#2a1a6a','#08425a','#4a1a5a','#2a4a0c']},
 Candy:{l:['#ffc6e0','#c6e6ff','#fff3b0','#d9c6ff','#c6ffd9'],d:['#4a1a35','#16365a','#4a440c','#2e1a5a','#0c4a2c']},
 Calm:{l:['#e3e8e5','#d5dde0','#e8e6df','#dde0e8','#e3e8e5'],d:['#1a2320','#161e26','#201e18','#1b1c26','#1a2320']}
};
const ACC={Default:'',Blue:'#2563eb',Purple:'#7c3aed',Orange:'#c2570c',Pink:'#db2777',Teal:'#0f766e'};
const SPD={Slow:'28s',Normal:'14s',Fast:'6s'};
const OPT={pal:Object.keys(PAL),spd:Object.keys(SPD),acc:Object.keys(ACC),anim:['On','Off']};
const LBL={pal:'Gradient colors',spd:'Animation speed',acc:'Accent color',anim:'Background animation'};
const LOOK0={pal:'Meadow',spd:'Normal',acc:'Default',anim:'On'};
let look={...LOOK0};
try{look={...LOOK0,...JSON.parse(localStorage.getItem('vof.look')||'{}')}}catch(e){}
const saveLook=()=>{try{localStorage.setItem('vof.look',JSON.stringify(look))}catch(e){}};
const isDk=()=>thm==='dark'||(thm==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
function applyLook(){
  const r=document.documentElement,p=(PAL[look.pal]||PAL.Meadow)[isDk()?'d':'l'];
  p.forEach((c,i)=>r.style.setProperty('--g'+(i+1),c));
  r.style.setProperty('--dur',SPD[look.spd]||'14s');
  if(look.anim==='Off')r.setAttribute('data-anim','off');else r.removeAttribute('data-anim');
  const a=ACC[look.acc];
  if(a){r.style.setProperty('--brand',a);r.style.setProperty('--brandink','#fff');r.style.setProperty('--soft','color-mix(in srgb,'+a+' 16%,var(--card))')}
  else['--brand','--brandink','--soft'].forEach(k=>r.style.removeProperty(k));
}
function buildCS(){
  $('#cb').innerHTML=Object.keys(OPT).map(k=>'<h4>'+LBL[k]+'</h4><div style="display:flex;gap:6px;flex-wrap:wrap">'+OPT[k].map(v=>'<button type="button" class="chip'+(look[k]===v?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+(k==='acc'?'<i class="sw" style="background:'+(ACC[v]||'#1f7a5a')+'"></i>':'')+v+'</button>').join('')+'</div>').join('');
}
$('#cb').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;look[b.dataset.k]=b.dataset.v;saveLook();applyLook();buildCS()};
$('#cu').onclick=()=>{buildCS();$('#cs').showModal()};
$('#cc').onclick=()=>$('#cs').close();
$('#cr').onclick=()=>{look={...LOOK0};saveLook();applyLook();buildCS();toast('Reset to default')};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyLook);
applyTheme();
load();norm();render();
</script>
